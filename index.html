<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Это важно</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fdf6e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Comic Neue', cursive;
    }

    /* ── СЦЕНА ── */
    .scene {
      position: relative;
      width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── НАДПИСЬ СВЕРХУ ── */
    .intro-text {
      font-family: 'Bangers', cursive;
      font-size: 1.35rem;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 14px;

      opacity: 0;
      transform: translateY(-30px);
      animation: dropIn 0.7s cubic-bezier(.3,1.4,.5,1) 0.4s forwards;
    }

    @keyframes dropIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── КОТИК ── */
    .cat-wrap {
      position: relative;
      width: 280px;

      /* Сам котик «падает» сверху как слайд PowerPoint */
      clip-path: inset(0 0 100% 0);
      animation: slideDown 0.9s cubic-bezier(.4,1.3,.5,1) 1.6s forwards;
    }

    @keyframes slideDown {
      to { clip-path: inset(0 0 0% 0); }
    }

    .cat-wrap img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.18));
    }

    /* ── ПУЗЫРЁК РЕЧИ ── */
    /* Пузырёк — сосед .cat-wrap внутри .scene, позиционируется относительно .scene */
    .bubble {
      position: absolute;
      right: -10px;
      bottom: 110px;
      width: 150px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 20px;
      padding: 12px 14px;
      font-family: 'Comic Neue', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      color: #111;
      line-height: 1.35;
      text-align: center;
      box-shadow: 3px 3px 0 #111;

      opacity: 0;
      transform: translateX(40px) scale(0.8);
      animation: popIn 0.6s cubic-bezier(.3,1.5,.5,1) 3s forwards;
    }

    /* хвостик — влево, к морде котика */
    .bubble::before {
      content: '';
      position: absolute;
      left: -18px;
      bottom: 22px;
      width: 0; height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 18px solid #111;
    }
    .bubble::after {
      content: '';
      position: absolute;
      left: -13px;
      bottom: 23px;
      width: 0; height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 14px solid #fff;
    }

    @keyframes popIn {
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <p class="intro-text">Это Бублик.<br>Ему не нравится 1 апреля.<br>Не шутите с 1 апреля.</p>

    <div class="cat-wrap">
      <img src="kitty.png" alt="Гэри" />
    </div>

    <div class="bubble">
      Первое апреля гавно ебаное.
    </div>
  </div>
</body>
</html>
